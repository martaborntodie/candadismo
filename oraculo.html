<body class="page-dj page-oracle">
<div id="player" class="player"></div>
<div id="app">
<header class="nav">
  <a href="index.html" class="nav__logo nav__logo--img"><img src="assets/img/candadismo-logo.png?v=2" alt="Candadismo"></a>
  <nav class="nav__links">
    <a href="ia.html"><span class="en">AI Creative</span><span class="es">Trabajos IA</span></a>
    <a href="dj.html">DJ</a>
  </nav>
  <button class="lang" id="langBtn" aria-label="Cambiar idioma / Switch language"><span data-l="en">EN</span> / <span data-l="es">ES</span></button>
</header>

<section class="oraculo" id="oraculo">
  <div class="or-head">
    <a class="mono or-back" href="index.html">← Home</a>
    <h1 class="display or-title"><span class="en">ORACLE</span><span class="es">ORÁCULO</span></h1>
    <p class="mono or-hint"><span class="en">Marseille tarot · think of your question and pick three cards</span><span class="es">Tarot de Marsella · piensa en tu pregunta y elige tres cartas</span></p>
  </div>
  <div class="or-deck"></div>
  <div class="or-result">
    <div class="or-slots">
      <div class="or-slot"><p class="mono"><span class="en">What was</span><span class="es">Lo que fue</span></p><div class="or-slot__card"></div></div>
      <div class="or-slot"><p class="mono"><span class="en">What is</span><span class="es">Lo que es</span></p><div class="or-slot__card"></div></div>
      <div class="or-slot"><p class="mono"><span class="en">What opens</span><span class="es">Lo que se abre</span></p><div class="or-slot__card"></div></div>
    </div>
    <div class="or-side">
      <div class="or-reading" aria-live="polite"></div>
      <button class="btn btn--line or-again" type="button" hidden><span class="en">Shuffle again</span><span class="es">Volver a barajar</span></button>
    </div>
  </div>
</section>
</div>
<script src="https://w.soundcloud.com/player/api.js"></script>
