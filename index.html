<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candadismo — AI Creative &amp; DJ</title>
<meta name="description" content="Candadismo — Marta Cruz Ortiz, Barcelona-based AI Creative / Visual & Video Designer, and DJ as Candadismo (Deprerreo collective).">
<meta property="og:title" content="Candadismo — AI Creative & DJ">
<meta property="og:description" content="AI video & visual content for music, fashion and culture. DJ as Candadismo.">
<meta property="og:image" content="assets/img/og.jpg">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Red+Hat+Display:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<body class="landing">
<div id="player" class="player"></div>
<div id="app">
<button class="lang lang--float" id="langBtn" aria-label="Cambiar idioma / Switch language"><span data-l="en">EN</span> / <span data-l="es">ES</span></button>
<main class="gate">
  <header class="gate__head">
    <h1 class="gate__logo"><img src="assets/img/logo-candadismo.png" alt="Candadismo"></h1>
    <p class="mono"><span class="en">Choose a side</span><span class="es">Elige un lado</span> ✶</p>
  </header>
  <div class="gate__doors">
    <a class="door door--ia" href="ia.html" aria-label="AI / IA">
      <span class="obj tv">
        <img class="tv__off" src="assets/img/tv-off.jpg" alt="">
        <img class="tv__on" src="assets/img/tv-on.jpg" alt="">
        <span class="tv__glow" aria-hidden="true"></span>
      </span>
      <span class="door__label">
        <span class="mono door__num">01</span>
        <span class="display door__title"><span class="en">AI</span><span class="es">IA</span></span>
        <span class="mono door__sub">AI Creative · Visual &amp; Video</span>
      </span>
    </a>
    <a class="door door--dj" href="dj.html" aria-label="DJ">
      <span class="obj cdj"><img src="assets/img/cdj.jpg" alt=""></span>
      <span class="door__label">
        <span class="mono door__num">02</span>
        <span class="display door__title">DJ</span>
        <span class="mono door__sub">DJ · <span class="en">Producer</span><span class="es">Productora</span> · Deprerreo</span>
      </span>
    </a>
  </div>
  <footer class="gate__foot mono">
    <span class="gate__mails"><a href="mailto:martacruzortiz2000@gmail.com"><b>AI</b> martacruzortiz2000@gmail.com</a><a href="mailto:deprerreoforever@gmail.com"><b>DJ</b> deprerreoforever@gmail.com</a></span>
    <a href="https://www.instagram.com/candadismo/" target="_blank" rel="noopener">@candadismo ↗</a>
  </footer>
</main>
</div>
<script src="https://w.soundcloud.com/player/api.js"></script>
<script src="player.js"></script>
<script src="main.js"></script>
</body>
</html>
